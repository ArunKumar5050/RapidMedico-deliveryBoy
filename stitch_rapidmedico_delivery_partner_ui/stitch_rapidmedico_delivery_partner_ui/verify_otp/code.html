<style>

        /* Verification Animation */

            border: 3px solid rgba(255,255,255,0.3);

            height: 24px;

<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                if (e.target.value !== '') {
                    // Move to next input
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    // Move to previous input on backspace if empty
                    if (index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/[^0-9]/g, '');
                
                if(pastedData) {
                    for(let i=0; i < pastedData.length; i++) {
                        if(inputs[i]) {
                            inputs[i].value = pastedData[i];
                            if(i < inputs.length - 1) {
                                inputs[i+1].focus();
                            } else {
                                inputs[i].blur();
                            }
                        }
                    }
                }
            });
        });

        // Timer Logic
        let timeLeft = 30;
        const timerText = document.getElementById('timerText');
        const progressRing = document.getElementById('progressRing');
        const resendBtn = document.getElementById('resendBtn');
        const totalDuration = 30;
        const circleCircumference = 2 * Math.PI * 20; // r=20

        progressRing.style.strokeDasharray = `${circleCircumference} ${circleCircumference}`;
        
        const timerInterval = setInterval(() => {
            timeLeft--;
            timerText.textContent = timeLeft;
            
            // Calculate offset
            const offset = circleCircumference - (timeLeft / totalDuration) * circleCircumference;
            progressRing.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerText.textContent = '0';
                resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                resendBtn.disabled = false;
                progressRing.style.stroke = 'rgba(255,255,255,0.1)';
            }
        }, 1000);

        // Verification Button Logic
        const verifyBtn = document.getElementById('verifyBtn');
        const btnText = document.querySelector('.btn-text');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnCheck = document.getElementById('btnCheck');

        verifyBtn.addEventListener('click', () => {
            // Check if all inputs are filled (mock validation)
            const isFilled = Array.from(inputs).every(input => input.value !== '');
            
            if(!isFilled) {
                // Shake effect if not filled
                verifyBtn.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 400, easing: 'ease-in-out' });
                return;
            }

            // Start Loading State
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            verifyBtn.classList.add('opacity-90');
            
            // Mock API Call Delay
            setTimeout(() => {
                // Success State
                btnSpinner.style.display = 'none';
                btnCheck.style.display = 'block';
                verifyBtn.style.background = 'theme("colors.tertiary-container")'; // Greenish success
                verifyBtn.style.boxShadow = '0 4px 16px rgba(74,225,118,0.3)';
                
                // Redirect mock
                setTimeout(() => {
                    alert("OTP Verified. Proceeding to Dashboard.");
                }, 1000);
            }, 2000);
        });
    </script>
