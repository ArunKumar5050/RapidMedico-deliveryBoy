<style>
  body {
    background-color: #0A0F1C;
    color: theme('colors.on-surface');
  }
  .input-field {
    @apply w-full bg-[#0A0F1C] border border-white/10 rounded-xl px-4 py-3 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary shadow-[0_0_15px_rgba(77,142,255,0)] focus:shadow-[0_0_15px_rgba(77,142,255,0.15)] transition-all duration-300;
  }
  .input-label {
    @apply block text-label-bold font-label-bold text-on-surface-variant mb-2 ml-1;
  }
  .btn-primary {
    @apply w-full bg-gradient-to-r from-primary to-secondary text-background font-label-bold text-label-bold py-4 rounded-xl flex items-center justify-center gap-2 active:scale-95 active:brightness-125 transition-all duration-200;
  }
  .gender-pill {
    @apply flex-1 py-3 border border-white/10 rounded-xl text-center text-body-md font-body-md text-on-surface-variant cursor-pointer transition-all duration-300;
  }
  .gender-pill.selected {
    @apply border-primary/50 bg-primary/10 text-primary shadow-[0_0_15px_rgba(77,142,255,0.15)];
  }
  
  /* Slide transition for content */
  .slide-in-right {
    animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col items-center justify-start pb-safe overflow-x-hidden antialiased selection:bg-primary/30">
<!-- Top App Bar (Modified for transactional view - back button only) -->
<header class="w-full flex justify-between items-center px-container-margin py-4 bg-surface-dim z-50">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-headline-lg font-headline-lg font-bold text-primary">RapidMedico</div>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-md mx-auto px-container-margin flex flex-col flex-1 slide-in-right">
<!-- Progress Indicator -->
<div class="w-full mt-6 mb-8">
<div class="flex justify-between items-center mb-2">
<span class="text-label-bold font-label-bold text-primary">Step 1 of 4</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Personal Info</span>
</div>
<div class="flex gap-2 w-full h-1.5 rounded-full overflow-hidden">
<div class="flex-1 bg-primary shadow-[0_0_8px_rgba(77,142,255,0.5)] rounded-full"></div>
<div class="flex-1 bg-white/10 rounded-full"></div>
<div class="flex-1 bg-white/10 rounded-full"></div>
<div class="flex-1 bg-white/10 rounded-full"></div>
</div>
</div>
<!-- Header -->
<div class="mb-8">
<h1 class="text-display-stat font-display-stat text-on-surface mb-2">Create Account</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Join the medical logistics network.</p>
</div>
<!-- Form Card -->
<div class="bg-[#111827] border border-white/10 rounded-[20px] p-6 shadow-xl relative overflow-hidden group">
<!-- Subtle background glow -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
<form class="space-y-stack-gap relative z-10" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div>
<label class="input-label" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">person</span>
<input class="input-field pl-12" id="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="input-label" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">mail</span>
<input class="input-field pl-12" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Mobile -->
<div>
<label class="input-label" for="mobile">Mobile Number</label>
<div class="flex gap-2">
<div class="bg-[#0A0F1C] border border-white/10 rounded-xl px-3 flex items-center justify-center text-body-md font-body-md text-on-surface shadow-sm shrink-0">
                        🇮🇳 +91
                    </div>
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">smartphone</span>
<input class="input-field pl-12" id="mobile" pattern="[0-9]{10}" placeholder="00000 00000" required="" type="tel"/>
</div>
</div>
</div>
<!-- DOB -->
<div>
<label class="input-label" for="dob">Date of Birth</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_month</span>
<input class="input-field pl-12 [&amp;::-webkit-calendar-picker-indicator]:invert" id="dob" required="" type="date"/>
</div>
</div>
<!-- Gender -->
<div>
<label class="input-label">Gender</label>
<div class="flex gap-3">
<div class="gender-pill selected" onclick="selectGender(this)">Male</div>
<div class="gender-pill" onclick="selectGender(this)">Female</div>
<div class="gender-pill" onclick="selectGender(this)">Other</div>
</div>
</div>
</form>
</div>
<!-- Spacer to push button to bottom if needed, though form is long -->
<div class="flex-1 min-h-[2rem]"></div>
<!-- Next Button Area -->
<div class="mt-8 pb-8">
<button class="btn-primary group relative overflow-hidden">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="relative z-10 flex items-center gap-2">
                Continue to Verification
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</span>
</button>
<p class="text-center text-label-sm font-label-sm text-on-surface-variant mt-4">
            By continuing, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a>
</p>
</div>
</main>
<script>
    function selectGender(element) {
        // Remove selected class from all siblings
        const siblings = element.parentElement.children;
        for (let i = 0; i < siblings.length; i++) {
            siblings[i].classList.remove('selected');
        }
        // Add selected class to clicked element
        element.classList.add('selected');
    }
</script>
</body></html>
