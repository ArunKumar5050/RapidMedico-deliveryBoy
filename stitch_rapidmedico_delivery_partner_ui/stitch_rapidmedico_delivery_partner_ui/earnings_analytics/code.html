<script>
        // Count up animation for Today's Total
        const totalEl = document.getElementById('today-total');
        const targetValue = 2450;
        let currentValue = 0;
        const duration = 1500;
        const frameRate = 30;
        const totalFrames = duration / (1000 / frameRate);
        const increment = targetValue / totalFrames;

        const counter = setInterval(() => {
            currentValue += increment;
            if (currentValue >= targetValue) {
                currentValue = targetValue;
                clearInterval(counter);
            }
            totalEl.textContent = `₹${Math.floor(currentValue).toLocaleString('en-IN')}`;
        }, 1000 / frameRate);

        // Staggered list population
        const earningsData = [
            { id: "ORD-9921", route: "Apollo Hosp → Sector 44", amount: "+₹180", time: "10 mins ago" },
            { id: "ORD-9918", route: "MedPlus → DLF Phase 3", amount: "+₹120", time: "45 mins ago" },
            { id: "ORD-9905", route: "Max Hosp → Sushant Lok", amount: "+₹350", time: "2 hrs ago" },
            { id: "ORD-9892", route: "1mg Lab → Udyog Vihar", amount: "+₹210", time: "4 hrs ago" }
        ];

        const listContainer = document.getElementById('earnings-list');
        
        earningsData.forEach((item, index) => {
            const delay = index * 0.15;
            const el = document.createElement('div');
            el.className = `bg-[#111827] border border-white/5 rounded-xl p-4 flex items-center justify-between stagger-item hover:border-white/20 transition-colors`;
            el.style.animationDelay = `${delay}s`;
            
            el.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
                        <span class="material-symbols-outlined text-on-surface-variant text-sm">local_shipping</span>
                    </div>
                    <div>
                        <div class="text-body-md font-body-md text-on-background font-medium">${item.id}</div>
                        <div class="text-label-sm font-label-sm text-on-surface-variant line-clamp-1">${item.route}</div>
                        <div class="text-[10px] text-outline mt-0.5">${item.time}</div>
                    </div>
                </div>
                <div class="text-body-lg font-body-lg font-semibold text-tertiary">${item.amount}</div>
            `;
            listContainer.appendChild(el);
        });
    </script>
