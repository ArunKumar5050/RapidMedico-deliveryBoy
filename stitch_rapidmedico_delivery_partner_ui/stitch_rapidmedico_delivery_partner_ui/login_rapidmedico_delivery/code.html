<style>
        /* Custom Keyframes and Utility Styles not covered by arbitrary Tailwind */
        @keyframes pulse-glow {

        .animate-radial-glow {

        .bg-grid-pattern {

                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);

<body class="bg-background text-on-background min-h-screen font-body-md relative overflow-hidden flex flex-col justify-center px-container-margin">
<!-- Atmospheric Background Effects -->
<div class="absolute inset-0 bg-grid-pattern pointer-events-none z-0"></div>
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-primary-container rounded-full blur-[100px] opacity-10 pointer-events-none z-0 animate-radial-glow"></div>
<div class="absolute bottom-0 right-0 w-[200px] h-[200px] bg-secondary-container rounded-full blur-[80px] opacity-10 pointer-events-none z-0"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md mx-auto">
<!-- Branding Header -->
<header class="text-center mb-10 flex flex-col items-center">
<div class="relative w-20 h-20 mb-4 flex items-center justify-center bg-surface-container-low rounded-2xl shadow-[0px_8px_24px_rgba(59,130,246,0.15)] border border-white/10">
<!-- Icon Motif -->
<span class="material-symbols-outlined text-[40px] text-primary" data-icon="medication" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    medication
                </span>
<!-- Glowing Ring -->
<div class="absolute inset-0 rounded-2xl border border-primary/30 shadow-[0_0_15px_rgba(77,142,255,0.2)]"></div>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">RapidMedico</h1>
<p class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest mt-1">Medical Logistics</p>
</header>
<!-- Login Card Container -->
<section class="bg-[#111827] rounded-xl border border-white/10 p-section-padding shadow-2xl relative overflow-hidden">
<!-- Subtle Card Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-[#111827] to-[#0A0F1C] opacity-50 pointer-events-none"></div>
<div class="relative z-10">
<h2 class="text-headline-md font-headline-md text-on-surface mb-stack-gap text-center">Delivery Partner Login</h2>
<form class="flex flex-col gap-stack-gap" id="loginForm">
<!-- Phone Input Group -->
<div class="flex flex-col gap-2">
<label class="text-label-bold font-label-bold text-on-surface-variant" for="phone">Mobile Number</label>
<div class="relative flex items-center bg-surface rounded-lg border border-white/10 transition-all duration-200 focus-glow group h-12">
<!-- +91 Prefix Chip -->
<div class="flex items-center px-3 bg-surface-container-low h-full border-r border-white/10 rounded-l-lg text-on-surface font-label-bold">
                                +91
                            </div>
<!-- Input Field -->
<input autocomplete="tel" class="flex-1 bg-transparent border-none text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 px-4 py-0 h-full w-full" id="phone" maxlength="10" pattern="[0-9]{10}" placeholder="Enter 10-digit number" type="tel"/>
<!-- Validation Icon (Hidden by default) -->
<div class="px-3 hidden items-center justify-center text-tertiary" id="validIcon">
<span class="material-symbols-outlined text-lg" data-icon="check_circle">check_circle</span>
</div>
</div>
</div>
<!-- Submit CTA -->
<button class="w-full h-12 bg-gradient-to-r from-primary-container to-secondary-container rounded-lg text-on-primary-container text-body-md font-label-bold shadow-[0px_8px_24px_rgba(59,130,246,0.2)] disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed hover:brightness-110 active:scale-95 active:brightness-125 transition-all duration-200 flex items-center justify-center gap-2 mt-2" disabled="" id="submitBtn" type="submit">
                        Send OTP
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-6 text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                        First time? 
                        <a class="text-primary hover:text-primary-fixed transition-colors underline-offset-4 hover:underline" href="#">Register below</a>
</p>
</div>
</div>
</section>
</main>
<!-- Navigation Shell (SUPPRESSED) -->
<!-- As per instructions: Automatic Suppression for Linear/Transactional: Login screens. -->
<script>
        // Simple client-side interaction script
        document.addEventListener('DOMContentLoaded', () => {
            const phoneInput = document.getElementById('phone');
            const submitBtn = document.getElementById('submitBtn');
            const validIcon = document.getElementById('validIcon');

            phoneInput.addEventListener('input', (e) => {
                // Allow only numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                const isValid = e.target.value.length === 10;
                
                if (isValid) {
                    submitBtn.disabled = false;
                    validIcon.classList.remove('hidden');
                    validIcon.classList.add('flex');
                    // Add a subtle success flash to the border
                    e.target.parentElement.classList.add('border-tertiary');
                } else {
                    submitBtn.disabled = true;
                    validIcon.classList.add('hidden');
                    validIcon.classList.remove('flex');
                    e.target.parentElement.classList.remove('border-tertiary');
                }
            });

            // Prevent default form submission for demo purposes
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(phoneInput.value.length === 10) {
                     submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Sending...`;
                     // Simulate network request
                     setTimeout(() => {
                         submitBtn.innerHTML = `OTP Sent <span class="material-symbols-outlined" data-icon="check">check</span>`;
                     }, 1500);
                }
            });
        });
    </script>
</body></html>
